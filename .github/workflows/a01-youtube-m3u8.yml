name: A01 YouTube M3U8 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: A01-YouTube-M3U8-Player
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK exists
        run: test -s A01-YouTube-M3U8-Player/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: A01-YouTube-M3U8-Player-debug-APK
          path: A01-YouTube-M3U8-Player/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          echo "## A01 YouTube M3U8 Player" >> "$GITHUB_STEP_SUMMARY"
          echo "APK berhasil dibuat sebagai artifact: **A01-YouTube-M3U8-Player-debug-APK**" >> "$GITHUB_STEP_SUMMARY"
          echo "Unduh dari tab Actions → workflow run → Artifacts." >> "$GITHUB_STEP_SUMMARY"
